<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 690" width="1240" height="690"
     font-family="Segoe UI, Segoe UI Symbol, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8b93a7"/>
    </marker>
    <marker id="arP" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#ff6b35"/>
    </marker>
    <marker id="arS" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#22d1e4"/>
    </marker>
  </defs>

  <rect width="1240" height="690" fill="#11131a"/>
  <text x="34" y="44" fill="#ff8c1a" font-size="24" font-weight="600">Smart Driver — system block diagram</text>
  <text x="34" y="68" fill="#8b93a7" font-size="14">Arduino Nano · 2 × BTS7960 · differential drive soccer robot</text>

  <!-- ===== PC ===== -->
  <rect x="452" y="96" width="196" height="52" rx="8" fill="#1b2130" stroke="#3a4358"/>
  <text x="550" y="120" fill="#e8ecf4" font-size="14" font-weight="600" text-anchor="middle">PC</text>
  <text x="550" y="138" fill="#8b93a7" font-size="12" text-anchor="middle">Smart Driver Configurator</text>
  <line x1="550" y1="148" x2="550" y2="196" stroke="#22d1e4" stroke-width="2" marker-end="url(#arS)"/>
  <text x="560" y="176" fill="#22d1e4" font-size="12">USB · 115200</text>
  <text x="560" y="192" fill="#8b93a7" font-size="11">only while configuring</text>

  <!-- ===== receiver ===== -->
  <rect x="44" y="214" width="198" height="104" rx="8" fill="#1b2130" stroke="#3a4358"/>
  <text x="143" y="240" fill="#e8ecf4" font-size="14" font-weight="600" text-anchor="middle">RC receiver</text>
  <text x="143" y="260" fill="#8b93a7" font-size="12" text-anchor="middle">FlySky FS-iA6B</text>
  <text x="143" y="282" fill="#22d1e4" font-size="12" text-anchor="middle">PPM out → 1 wire</text>
  <text x="143" y="300" fill="#8b93a7" font-size="11" text-anchor="middle">(or 3 × PWM leads)</text>

  <line x1="242" y1="266" x2="446" y2="266" stroke="#22d1e4" stroke-width="2" marker-end="url(#arS)"/>
  <text x="344" y="258" fill="#22d1e4" font-size="12" text-anchor="middle">PPM → D4</text>

  <!-- ===== Nano ===== -->
  <rect x="452" y="196" width="196" height="214" rx="8" fill="#1b2130" stroke="#ff8c1a" stroke-width="2"/>
  <text x="550" y="224" fill="#ff8c1a" font-size="15" font-weight="600" text-anchor="middle">Arduino Nano</text>
  <text x="550" y="244" fill="#8b93a7" font-size="12" text-anchor="middle">ATmega328P · 16 MHz</text>
  <line x1="470" y1="256" x2="630" y2="256" stroke="#3a4358"/>
  <text x="470" y="278" fill="#e8ecf4" font-size="12">decode RC</text>
  <text x="470" y="298" fill="#e8ecf4" font-size="12">mix · dead-band</text>
  <text x="470" y="318" fill="#e8ecf4" font-size="12">31 kHz PWM out</text>
  <text x="470" y="338" fill="#e8ecf4" font-size="12">battery cutoff</text>
  <text x="470" y="358" fill="#e8ecf4" font-size="12">failsafe + arming</text>
  <text x="470" y="382" fill="#8b93a7" font-size="11">settings in EEPROM</text>
  <text x="470" y="398" fill="#8b93a7" font-size="11">2 s config window at boot</text>

  <!-- ===== drivers ===== -->
  <line x1="648" y1="252" x2="824" y2="252" stroke="#22d1e4" stroke-width="2" marker-end="url(#arS)"/>
  <text x="736" y="244" fill="#22d1e4" font-size="12" text-anchor="middle">D9 · D3</text>
  <line x1="648" y1="352" x2="824" y2="352" stroke="#22d1e4" stroke-width="2" marker-end="url(#arS)"/>
  <text x="736" y="344" fill="#22d1e4" font-size="12" text-anchor="middle">D11 · D10</text>

  <rect x="830" y="206" width="196" height="92" rx="8" fill="#1b2130" stroke="#3a4358"/>
  <text x="928" y="232" fill="#e8ecf4" font-size="14" font-weight="600" text-anchor="middle">BTS7960 — LEFT</text>
  <text x="928" y="252" fill="#8b93a7" font-size="12" text-anchor="middle">IBT-2 H-bridge</text>
  <text x="928" y="272" fill="#8b93a7" font-size="11" text-anchor="middle">RPWM=D9  LPWM=D3</text>
  <text x="928" y="290" fill="#8b93a7" font-size="11" text-anchor="middle">R_EN · L_EN tied to 5 V</text>

  <rect x="830" y="306" width="196" height="92" rx="8" fill="#1b2130" stroke="#3a4358"/>
  <text x="928" y="332" fill="#e8ecf4" font-size="14" font-weight="600" text-anchor="middle">BTS7960 — RIGHT</text>
  <text x="928" y="352" fill="#8b93a7" font-size="12" text-anchor="middle">IBT-2 H-bridge</text>
  <text x="928" y="372" fill="#8b93a7" font-size="11" text-anchor="middle">RPWM=D11  LPWM=D10</text>
  <text x="928" y="390" fill="#8b93a7" font-size="11" text-anchor="middle">R_EN · L_EN tied to 5 V</text>

  <!-- ===== motors ===== -->
  <line x1="1026" y1="252" x2="1096" y2="252" stroke="#8b93a7" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1026" y1="352" x2="1096" y2="352" stroke="#8b93a7" stroke-width="2" marker-end="url(#ar)"/>
  <circle cx="1142" cy="252" r="36" fill="#1b2130" stroke="#3a4358" stroke-width="2"/>
  <text x="1142" y="258" fill="#e8ecf4" font-size="17" font-weight="600" text-anchor="middle">M</text>
  <text x="1142" y="306" fill="#8b93a7" font-size="12" text-anchor="middle">left</text>
  <circle cx="1142" cy="352" r="36" fill="#1b2130" stroke="#3a4358" stroke-width="2"/>
  <text x="1142" y="358" fill="#e8ecf4" font-size="17" font-weight="600" text-anchor="middle">M</text>
  <text x="1142" y="406" fill="#8b93a7" font-size="12" text-anchor="middle">right</text>

  <!-- ===== battery ===== -->
  <rect x="44" y="470" width="198" height="94" rx="8" fill="#1b2130" stroke="#ff6b35" stroke-width="2"/>
  <text x="143" y="496" fill="#ff6b35" font-size="14" font-weight="600" text-anchor="middle">Battery 3S LiPo</text>
  <text x="143" y="516" fill="#8b93a7" font-size="12" text-anchor="middle">11.1 V nom · 12.6 V full</text>
  <text x="143" y="536" fill="#8b93a7" font-size="12" text-anchor="middle">cutoff 10.5 V</text>
  <text x="143" y="554" fill="#8b93a7" font-size="11" text-anchor="middle">= 3.5 V per cell</text>

  <!-- battery to drivers (high current) -->
  <path d="M242 500 H780 V298 H824" fill="none" stroke="#ff6b35" stroke-width="3" marker-end="url(#arP)"/>
  <path d="M780 500 V398 H824" fill="none" stroke="#ff6b35" stroke-width="3" marker-end="url(#arP)"/>
  <text x="258" y="492" fill="#ff6b35" font-size="12">B+ / B−  motor current</text>

  <!-- buck -->
  <rect x="300" y="596" width="180" height="60" rx="8" fill="#1b2130" stroke="#3a4358"/>
  <text x="390" y="620" fill="#e8ecf4" font-size="13" font-weight="600" text-anchor="middle">Buck 12 V → 5 V</text>
  <text x="390" y="640" fill="#8b93a7" font-size="11" text-anchor="middle">feeds Nano 5 V pin</text>
  <path d="M143 564 V626 H294" fill="none" stroke="#ff6b35" stroke-width="2" marker-end="url(#arP)"/>
  <path d="M480 626 H620 V416" fill="none" stroke="#ff6b35" stroke-width="2" marker-end="url(#arP)"/>
  <text x="630" y="566" fill="#ff6b35" font-size="12">5 V logic</text>

  <!-- divider -->
  <rect x="760" y="468" width="266" height="96" rx="8" fill="#1b2130" stroke="#3a4358"/>
  <text x="893" y="492" fill="#e8ecf4" font-size="13" font-weight="600" text-anchor="middle">Voltage divider → A0</text>
  <text x="893" y="514" fill="#8b93a7" font-size="12" text-anchor="middle">5 kΩ top · 1 kΩ bottom = ÷6</text>
  <text x="893" y="534" fill="#8b93a7" font-size="12" text-anchor="middle">12.6 V pack → 2.1 V at the pin</text>
  <text x="893" y="554" fill="#22d1e4" font-size="11" text-anchor="middle">full ADC range covers 0–30 V</text>
  <path d="M242 530 H754" fill="none" stroke="#ff6b35" stroke-width="2" marker-end="url(#arP)"/>
  <path d="M760 500 H690 V416" fill="none" stroke="#22d1e4" stroke-width="2" marker-end="url(#arS)"/>
  <text x="660" y="446" fill="#22d1e4" font-size="12" text-anchor="end">A0</text>

  <!-- LED -->
  <rect x="452" y="440" width="140" height="44" rx="8" fill="#1b2130" stroke="#3a4358"/>
  <text x="522" y="458" fill="#e8ecf4" font-size="12" font-weight="600" text-anchor="middle">status LED</text>
  <text x="522" y="475" fill="#8b93a7" font-size="11" text-anchor="middle">D13 + 330 Ω</text>
  <line x1="522" y1="410" x2="522" y2="436" stroke="#22d1e4" stroke-width="2" marker-end="url(#arS)"/>

  <!-- legend -->
  <text x="34" y="366" fill="#8b93a7" font-size="12" font-weight="600">LEGEND</text>
  <line x1="34" y1="384" x2="74" y2="384" stroke="#ff6b35" stroke-width="3"/>
  <text x="82" y="389" fill="#8b93a7" font-size="12">power</text>
  <line x1="34" y1="406" x2="74" y2="406" stroke="#22d1e4" stroke-width="2"/>
  <text x="82" y="411" fill="#8b93a7" font-size="12">signal</text>
  <line x1="34" y1="428" x2="74" y2="428" stroke="#8b93a7" stroke-width="2"/>
  <text x="82" y="433" fill="#8b93a7" font-size="12">motor output</text>

  <text x="34" y="676" fill="#5d6577" font-size="11">All grounds common. Battery negative, Nano GND, both driver GNDs and the receiver ground must meet at one point.</text>
</svg>
