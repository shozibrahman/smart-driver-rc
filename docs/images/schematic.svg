<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1010" width="1320" height="1010"
     font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="w" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22d1e4"/>
    </marker>
    <marker id="p" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#ff6b35"/>
    </marker>
  </defs>
  <rect width="1320" height="1010" fill="#11131a"/>

  <text x="34" y="44" fill="#ff8c1a" font-size="24" font-weight="600">Smart Driver — wiring detail</text>
  <text x="34" y="68" fill="#8b93a7" font-size="14">Every connection on the current build. Pin names are as printed on the boards.</text>

  <!-- ===================== NANO ===================== -->
  <rect x="470" y="110" width="340" height="560" rx="10" fill="#1b2130" stroke="#ff8c1a" stroke-width="2"/>
  <text x="640" y="140" fill="#ff8c1a" font-size="16" font-weight="600" text-anchor="middle">Arduino Nano</text>
  <text x="640" y="160" fill="#8b93a7" font-size="12" text-anchor="middle">U1 · ATmega328P · 16 MHz</text>
  <line x1="490" y1="174" x2="790" y2="174" stroke="#3a4358"/>

  <!-- left column: inputs and power -->
  <text x="478" y="204" fill="#22d1e4" font-size="13" font-weight="600">D4</text>
  <text x="512" y="204" fill="#8b93a7" font-size="11">PPM in / ch1</text>
  <text x="478" y="232" fill="#22d1e4" font-size="13" font-weight="600">D5</text>
  <text x="512" y="232" fill="#8b93a7" font-size="11">ch2 PWM</text>
  <text x="478" y="260" fill="#22d1e4" font-size="13" font-weight="600">D6</text>
  <text x="512" y="260" fill="#8b93a7" font-size="11">ch3 PWM</text>

  <text x="478" y="312" fill="#22d1e4" font-size="13" font-weight="600">A0</text>
  <text x="512" y="312" fill="#8b93a7" font-size="11">batt sense</text>

  <text x="478" y="360" fill="#8b93a7" font-size="13" font-weight="600">D0</text>
  <text x="512" y="360" fill="#8b93a7" font-size="11">USB RX</text>
  <text x="478" y="384" fill="#8b93a7" font-size="13" font-weight="600">D1</text>
  <text x="512" y="384" fill="#8b93a7" font-size="11">USB TX</text>

  <text x="478" y="604" fill="#ff6b35" font-size="13" font-weight="600">5V</text>
  <text x="512" y="604" fill="#8b93a7" font-size="11">from buck</text>
  <text x="478" y="632" fill="#ff6b35" font-size="13" font-weight="600">GND</text>
  <text x="522" y="632" fill="#8b93a7" font-size="11">common</text>

  <!-- right column: outputs. Rows are aligned to the driver pins, so
       every motor wire is a straight horizontal line. -->
  <text x="802" y="232" fill="#22d1e4" font-size="13" font-weight="600" text-anchor="end">D9</text>
  <text x="772" y="232" fill="#8b93a7" font-size="11" text-anchor="end">RPWM_L · T1</text>
  <text x="802" y="256" fill="#22d1e4" font-size="13" font-weight="600" text-anchor="end">D3</text>
  <text x="772" y="256" fill="#8b93a7" font-size="11" text-anchor="end">LPWM_L · T2</text>

  <text x="802" y="462" fill="#22d1e4" font-size="13" font-weight="600" text-anchor="end">D11</text>
  <text x="768" y="462" fill="#8b93a7" font-size="11" text-anchor="end">RPWM_R · T2</text>
  <text x="802" y="486" fill="#22d1e4" font-size="13" font-weight="600" text-anchor="end">D10</text>
  <text x="768" y="486" fill="#8b93a7" font-size="11" text-anchor="end">LPWM_R · T1</text>

  <text x="802" y="560" fill="#22d1e4" font-size="13" font-weight="600" text-anchor="end">D13</text>
  <text x="768" y="560" fill="#8b93a7" font-size="11" text-anchor="end">status LED</text>

  <text x="478" y="432" fill="#5d6577" font-size="11">free: D2 D7 D8 D12 A1–A7</text>
  <text x="478" y="450" fill="#5d6577" font-size="11">(and D5 D6 when running PPM)</text>

  <!-- ===================== RECEIVER ===================== -->
  <rect x="40" y="150" width="210" height="140" rx="10" fill="#1b2130" stroke="#3a4358"/>
  <text x="145" y="176" fill="#e8ecf4" font-size="14" font-weight="600" text-anchor="middle">RX1 — FS-iA6B</text>
  <text x="145" y="196" fill="#8b93a7" font-size="11" text-anchor="middle">RC receiver</text>
  <text x="56" y="226" fill="#22d1e4" font-size="12">PPM</text>
  <text x="56" y="252" fill="#ff6b35" font-size="12">+5V</text>
  <text x="56" y="278" fill="#8b93a7" font-size="12">GND</text>

  <path d="M250 222 H380 V204 H464" fill="none" stroke="#22d1e4" stroke-width="2" marker-end="url(#w)"/>
  <path d="M250 250 H300 V604 H464" fill="none" stroke="#ff6b35" stroke-width="2" marker-end="url(#p)"/>
  <path d="M250 276 H330 V632 H464" fill="none" stroke="#8b93a7" stroke-width="2"/>

  <text x="258" y="240" fill="#22d1e4" font-size="11">PPM: one wire, every channel</text>

  <text x="44" y="326" fill="#8b93a7" font-size="11" font-weight="600">In 3 × PWM mode instead:</text>
  <text x="44" y="344" fill="#8b93a7" font-size="11">ch1 → D4    ch2 → D5    ch3 → D6</text>
  <text x="44" y="362" fill="#5d6577" font-size="11">one +5 V / GND pair is enough</text>

  <!-- ===================== DRIVER LEFT ===================== -->
  <rect x="864" y="160" width="240" height="190" rx="10" fill="#1b2130" stroke="#3a4358"/>
  <text x="984" y="186" fill="#e8ecf4" font-size="14" font-weight="600" text-anchor="middle">M1 — BTS7960 LEFT</text>
  <text x="984" y="204" fill="#8b93a7" font-size="11" text-anchor="middle">IBT-2 module</text>
  <text x="880" y="232" fill="#22d1e4" font-size="12">RPWM</text>
  <text x="880" y="256" fill="#22d1e4" font-size="12">LPWM</text>
  <text x="880" y="282" fill="#ff6b35" font-size="12">R_EN</text>
  <text x="880" y="300" fill="#ff6b35" font-size="12">L_EN</text>
  <text x="880" y="324" fill="#ff6b35" font-size="12">VCC</text>
  <text x="936" y="291" fill="#ff8c1a" font-size="11">tie all three to 5 V</text>
  <text x="1088" y="244" fill="#8b93a7" font-size="12" text-anchor="end">M+  M−</text>
  <text x="1088" y="324" fill="#ff6b35" font-size="12" text-anchor="end">B+  B−  → battery</text>

  <path d="M812 232 H858" fill="none" stroke="#22d1e4" stroke-width="2" marker-end="url(#w)"/>
  <path d="M812 256 H858" fill="none" stroke="#22d1e4" stroke-width="2" marker-end="url(#w)"/>

  <!-- ===================== DRIVER RIGHT ===================== -->
  <rect x="864" y="390" width="240" height="190" rx="10" fill="#1b2130" stroke="#3a4358"/>
  <text x="984" y="416" fill="#e8ecf4" font-size="14" font-weight="600" text-anchor="middle">M2 — BTS7960 RIGHT</text>
  <text x="984" y="434" fill="#8b93a7" font-size="11" text-anchor="middle">IBT-2 module</text>
  <text x="880" y="462" fill="#22d1e4" font-size="12">RPWM</text>
  <text x="880" y="486" fill="#22d1e4" font-size="12">LPWM</text>
  <text x="880" y="512" fill="#ff6b35" font-size="12">R_EN</text>
  <text x="880" y="530" fill="#ff6b35" font-size="12">L_EN</text>
  <text x="880" y="554" fill="#ff6b35" font-size="12">VCC</text>
  <text x="936" y="521" fill="#ff8c1a" font-size="11">tie all three to 5 V</text>
  <text x="1088" y="474" fill="#8b93a7" font-size="12" text-anchor="end">M+  M−</text>
  <text x="1088" y="554" fill="#ff6b35" font-size="12" text-anchor="end">B+  B−  → battery</text>

  <path d="M812 462 H858" fill="none" stroke="#22d1e4" stroke-width="2" marker-end="url(#w)"/>
  <path d="M812 486 H858" fill="none" stroke="#22d1e4" stroke-width="2" marker-end="url(#w)"/>

  <!-- ===================== MOTORS ===================== -->
  <line x1="1104" y1="244" x2="1176" y2="244" stroke="#8b93a7" stroke-width="3"/>
  <circle cx="1216" cy="244" r="34" fill="#1b2130" stroke="#3a4358" stroke-width="2"/>
  <text x="1216" y="250" fill="#e8ecf4" font-size="16" font-weight="600" text-anchor="middle">M</text>
  <text x="1216" y="298" fill="#8b93a7" font-size="12" text-anchor="middle">left motor</text>

  <line x1="1104" y1="474" x2="1176" y2="474" stroke="#8b93a7" stroke-width="3"/>
  <circle cx="1216" cy="474" r="34" fill="#1b2130" stroke="#3a4358" stroke-width="2"/>
  <text x="1216" y="480" fill="#e8ecf4" font-size="16" font-weight="600" text-anchor="middle">M</text>
  <text x="1216" y="528" fill="#8b93a7" font-size="12" text-anchor="middle">right motor</text>

  <!-- D13 down to the LED card -->
  <path d="M812 560 H844 V684" fill="none" stroke="#22d1e4" stroke-width="2" marker-end="url(#w)"/>

  <!-- ===================== PULL-DOWNS ===================== -->
  <rect x="40" y="690" width="400" height="230" rx="10" fill="#1b2130" stroke="#3a4358"/>
  <text x="58" y="718" fill="#e8ecf4" font-size="14" font-weight="600">R3–R6 · 10 kΩ pull-downs</text>
  <text x="58" y="746" fill="#8b93a7" font-size="12">One from each of D3, D9, D10 and D11</text>
  <text x="58" y="766" fill="#8b93a7" font-size="12">to GND.</text>
  <text x="58" y="798" fill="#8b93a7" font-size="12">During reset and during the bootloader</text>
  <text x="58" y="818" fill="#8b93a7" font-size="12">those pins are high-impedance, and a</text>
  <text x="58" y="838" fill="#8b93a7" font-size="12">floating driver input can read as high.</text>
  <text x="58" y="870" fill="#ff8c1a" font-size="12">Without these, a motor can kick on</text>
  <text x="58" y="890" fill="#ff8c1a" font-size="12">power-up and on every upload.</text>

  <!-- ===================== DIVIDER ===================== -->
  <rect x="470" y="690" width="330" height="230" rx="10" fill="#1b2130" stroke="#3a4358"/>
  <text x="488" y="718" fill="#e8ecf4" font-size="14" font-weight="600">Battery sense — R1 / R2</text>

  <line x1="560" y1="736" x2="560" y2="752" stroke="#ff6b35" stroke-width="2"/>
  <text x="578" y="746" fill="#ff6b35" font-size="12">BATT +</text>

  <rect x="546" y="752" width="28" height="56" fill="none" stroke="#e8ecf4" stroke-width="2"/>
  <text x="590" y="784" fill="#e8ecf4" font-size="12">R1   5 kΩ</text>

  <line x1="560" y1="808" x2="560" y2="828" stroke="#e8ecf4" stroke-width="2"/>
  <line x1="562" y1="818" x2="676" y2="818" stroke="#22d1e4" stroke-width="2" marker-end="url(#w)"/>
  <text x="690" y="822" fill="#22d1e4" font-size="12">A0</text>

  <rect x="546" y="828" width="28" height="44" fill="none" stroke="#e8ecf4" stroke-width="2"/>
  <text x="590" y="854" fill="#e8ecf4" font-size="12">R2   1 kΩ</text>

  <line x1="560" y1="872" x2="560" y2="886" stroke="#8b93a7" stroke-width="2"/>
  <line x1="544" y1="886" x2="576" y2="886" stroke="#8b93a7" stroke-width="2"/>
  <line x1="550" y1="892" x2="570" y2="892" stroke="#8b93a7" stroke-width="2"/>
  <line x1="555" y1="898" x2="565" y2="898" stroke="#8b93a7" stroke-width="2"/>

  <text x="488" y="914" fill="#ff8c1a" font-size="12">5 kΩ MUST be the top resistor</text>

  <!-- ===================== LED ===================== -->
  <rect x="830" y="690" width="460" height="230" rx="10" fill="#1b2130" stroke="#3a4358"/>
  <text x="850" y="718" fill="#e8ecf4" font-size="14" font-weight="600">D1 — status LED on D13</text>
  <text x="850" y="740" fill="#8b93a7" font-size="12">through R7, 330 Ω, to GND. The onboard LED mirrors it.</text>

  <text x="850" y="780" fill="#2db175" font-size="12">solid</text>
  <text x="990" y="780" fill="#8b93a7" font-size="12">normal operation</text>
  <text x="850" y="806" fill="#ffc400" font-size="12">rapid blink</text>
  <text x="990" y="806" fill="#8b93a7" font-size="12">within 1 V of the cutoff</text>
  <text x="850" y="832" fill="#e92854" font-size="12">off</text>
  <text x="990" y="832" fill="#8b93a7" font-size="12">below cutoff, motors disabled</text>
  <text x="850" y="858" fill="#22d1e4" font-size="12">3 blinks + pause</text>
  <text x="990" y="858" fill="#8b93a7" font-size="12">configurator connected — motors live</text>

  <text x="850" y="894" fill="#5d6577" font-size="11">Patterns come from millis(), so there is no state to keep in step.</text>

  <!-- ===================== FOOTER ===================== -->
  <text x="34" y="958" fill="#5d6577" font-size="11">Motor supply and logic supply share one ground, joined at a single point away from the high-current return path.</text>
  <text x="34" y="976" fill="#5d6577" font-size="11">D0 and D1 are the USB serial lines. Nothing else may be wired to them, or firmware uploads and the configurator will fail.</text>
  <text x="34" y="994" fill="#5d6577" font-size="11">Timer1 drives D9 and D10; Timer2 drives D3 and D11; Timer0 is left alone because micros() — and every RC measurement — depends on it.</text>
</svg>
